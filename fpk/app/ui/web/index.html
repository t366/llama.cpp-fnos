<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llama.cpp</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f2f4f8; color: #1f2733;
  }
  .card {
    background: #fff; border-radius: 16px; padding: 40px 48px; max-width: 460px; width: calc(100% - 32px);
    box-shadow: 0 8px 30px rgba(15, 35, 70, .08); text-align: center;
  }
  .logo { font-size: 40px; line-height: 1; margin-bottom: 12px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .sub { color: #6b7686; font-size: 13px; margin-bottom: 28px; }
  .status {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px; border-radius: 999px; font-size: 14px;
    background: #f0f2f5; color: #6b7686;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #c0c8d2; }
  .status.ok { background: #e8f7ee; color: #1c7c46; }
  .status.ok .dot { background: #2bb45e; animation: pulse 1.6s infinite; }
  .status.err { background: #fdeeee; color: #b4332f; }
  .status.err .dot { background: #d9534f; }
  @keyframes pulse { 50% { opacity: .35; } }
  .meta { margin-top: 18px; font-size: 12px; color: #98a2b0; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🦙</div>
    <h1>llama.cpp 本地大模型</h1>
    <div class="sub">M1 链路验证版 —— 桌面入口、飞牛鉴权与后端连通性检查</div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">正在连接管理服务…</span></div>
    <div class="meta" id="meta"></div>
  </div>
<script>
  // 接口走相对路径：经 /cgi/ThirdParty/llamacpp/index.cgi/ 反代到 manager
  fetch("api/status")
    .then(function (r) {
      if (!r.ok) { throw new Error("HTTP " + r.status); }
      return r.json();
    })
    .then(function (d) {
      var el = document.getElementById("status");
      el.classList.add("ok");
      document.getElementById("statusText").textContent = "管理服务已连通";
      document.getElementById("meta").textContent =
        d.app + " v" + d.version + " · " + d.milestone + " · " + d.service;
    })
    .catch(function (e) {
      var el = document.getElementById("status");
      el.classList.add("err");
      document.getElementById("statusText").textContent = "管理服务未连通：" + e.message;
    });
</script>
</body>
</html>
